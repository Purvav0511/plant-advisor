# Installed per machine with `uv run pre-commit install` (the doctor warns if it's missing).
# Fast checks only; `uv run poe check` runs the full lint and tests.
repos:
  - repo: local
    hooks:
      - id: forbid-private-files
        name: block client data and secrets
        entry: uv run python -m scripts.forbid_private
        language: system
        pass_filenames: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
