name: Set up the toolchain
description: uv (pinned), Python from .python-version, Node from .node-version, pnpm from package.json, with caches.
inputs:
  python:
    description: Install the Python workspace (uv sync --locked)
    default: "true"
  node:
    description: Install Node dependencies (pnpm install --frozen-lockfile)
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.13.0"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - if: inputs.python == 'true'
      shell: bash
      run: uv sync --locked
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
