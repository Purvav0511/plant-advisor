# Free stand-in for branch protection (decision 0019): every commit on dev or main must be
# the merge of an allowed PR with green checks. Otherwise this fails and opens an issue.
name: guard

on:
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write

jobs:
  verify:
    name: verify push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - name: Check the push came from a green, allowed PR
        env:
          GH_TOKEN: ${{ github.token }}
        # Standard library only, so no dependency install is needed.
        run: uv run --no-project --python 3.12 python -m scripts.verify_push
