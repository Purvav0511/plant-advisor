[project]
name = "advisor-mcp"
version = "0.1.0"
description = "Read-only, tenant-scoped MCP tool server."
requires-python = ">=3.12,<3.13"
dependencies = [
    "advisor-core",
    "mcp",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
advisor-core = { workspace = true }
